<div class="admin-login-wrapper">
  <div class="admin-login-card">
    
    <!-- Brand Header -->
    <div class="login-header">
      <a routerLink="/" class="admin-brand" title="Back to Yogteck Home">
        <span class="brand-yog">YOG</span><span class="brand-teck">TECK</span>
      </a>
      <div class="brand-subtext">Business Solutions</div>
      <h1 class="login-title">Admin Login</h1>
      <p class="login-subtitle">Sign in to manage client inquiries and leads</p>
    </div>

    <!-- Error Alert Message -->
    <div *ngIf="errorMessage" class="error-banner" role="alert">
      <svg class="error-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Login Form -->
    <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)" class="login-form" novalidate>
      
      <!-- Username Field -->
      <div class="form-group">
        <label for="adminUsername" class="form-label">Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input
            type="text"
            id="adminUsername"
            name="username"
            [(ngModel)]="username"
            #userInput="ngModel"
            required
            class="form-control"
            placeholder="Enter admin username"
            autocomplete="username"
            autofocus
          />
        </div>
      </div>

      <!-- Password Field with Show/Hide Toggle -->
      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="adminPassword"
            name="password"
            [(ngModel)]="password"
            #passInput="ngModel"
            required
            class="form-control password-input"
            placeholder="Enter admin password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            tabindex="-1"
          >
            <!-- Eye Open Icon -->
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye Closed Icon -->
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        id="loginSubmitBtn"
        class="btn-login"
        [disabled]="isLoading || !username || !password"
      >
        <span *ngIf="!isLoading">Sign In to Dashboard</span>
        <span *ngIf="isLoading" class="loading-state">
          <span class="spinner"></span> Verifying...
        </span>
      </button>

    </form>

    <!-- Back to Public Site -->
    <div class="login-footer">
      <a routerLink="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Return to Website
      </a>
    </div>

  </div>
</div>
