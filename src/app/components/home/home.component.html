<!-- Main Navbar -->
<app-navbar
  (openQuote)="openQuoteModal()"
  (toggleDrawer)="openDrawer()">
</app-navbar>

<!-- Mobile Slide-out Drawer -->
<app-mobile-drawer
  [isOpen]="isDrawerOpen"
  (closeDrawer)="closeDrawer()"
  (openQuote)="openQuoteModal()">
</app-mobile-drawer>

<!-- Main Content Area -->
<main class="main-content" id="main-content">
  
  <!-- 1. Hero Section -->
  <app-hero
    (openQuote)="openQuoteModal()">
  </app-hero>

  <!-- 2. Feature Strip Directly Under Hero -->
  <app-feature-strip></app-feature-strip>

  <!-- 3. Business Growth Journey (Dark) -->
  <app-growth-journey></app-growth-journey>

  <!-- 4. Complete Digital Solutions / Services (Light Section) -->
  <app-services-section
    (openQuote)="openQuoteModal()"
    (selectService)="onServiceSelected($event)">
  </app-services-section>

  <!-- 5. Marketplace: Local to Global Growth (Dark) -->
  <app-marketplace-section></app-marketplace-section>

  <!-- 6. About & Why YOGTECK (Dark) -->
  <app-about-section></app-about-section>

  <!-- 7. Real Client Badges / Trusted By (Dark) -->
  <app-clients-strip></app-clients-strip>

  <!-- 8. Selected Projects & Case Studies (Light Section) -->
  <app-projects-section></app-projects-section>

  <!-- 9. CTA & Inquiry Form (Dark Glass) -->
  <app-inquiry-section></app-inquiry-section>

</main>

<!-- Site Footer -->
<app-footer></app-footer>

<!-- Sticky Mobile Action Bar (Call | WhatsApp | Email) -->
<app-mobile-action-bar></app-mobile-action-bar>

<!-- Floating WhatsApp Support Button (Desktop) -->
<app-floating-whatsapp></app-floating-whatsapp>

<!-- Instant Free Quote Modal Dialog -->
<app-quote-modal
  [isOpen]="isQuoteModalOpen"
  [defaultServiceTitle]="selectedServiceTitle"
  (closeModal)="closeQuoteModal()">
</app-quote-modal>
