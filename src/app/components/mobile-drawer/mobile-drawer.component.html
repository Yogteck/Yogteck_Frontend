<div class="drawer-backdrop" [class.is-open]="isOpen" (click)="closeDrawer.emit()" aria-hidden="true"></div>

<aside class="mobile-drawer" [class.is-open]="isOpen" [class.dir-rtl]="localeService.isRtl()" role="dialog" aria-label="Mobile Navigation" [attr.aria-hidden]="!isOpen">
  <!-- Drawer Header -->
  <div class="drawer-header">
    <div class="drawer-brand">
      <span class="brand-title">YOGTECK<span class="brand-dot">.</span></span>
      <span class="brand-sub">{{ contact.tagline }}</span>
    </div>
    <button type="button" (click)="closeDrawer.emit()" class="close-btn" aria-label="Close navigation menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Mobile Language Switcher Section -->
  <div class="drawer-lang-section">
    <app-language-switcher [variant]="'mobile'"></app-language-switcher>
  </div>

  <!-- Drawer Body Navigation -->
  <div class="drawer-body">
    <nav class="drawer-nav">
      <ul class="drawer-menu">
        
        <li class="drawer-item">
          <button type="button" class="drawer-link" (click)="onNavigate('home')">
            <span>{{ dict().nav.home }}</span>
            <svg viewBox="0 0 20 20" fill="currentColor" class="arrow-icon" aria-hidden="true"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
          </button>
        </li>

        <!-- Services Accordion -->
        <li class="drawer-item accordion-item">
          <button type="button" class="drawer-link accordion-toggle" (click)="toggleAccordion()">
            <span>{{ dict().nav.services }}</span>
            <svg class="chevron-icon" [class.rotated]="isServicesAccordionOpen" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>

          <div class="accordion-content" [class.is-expanded]="isServicesAccordionOpen">
            <ul class="sub-service-list">
              @for (srv of services; track srv.id) {
                <li>
                  <button type="button" class="sub-service-link" (click)="navigateToService(srv.slug)">
                    <span class="sub-bullet">•</span>
                    <span>{{ srv.title }}</span>
                  </button>
                </li>
              }
            </ul>
          </div>
        </li>

        <li class="drawer-item">
          <button type="button" class="drawer-link" (click)="onNavigate('growth-journey')">
            <span>{{ dict().nav.growthJourney }}</span>
            <svg viewBox="0 0 20 20" fill="currentColor" class="arrow-icon" aria-hidden="true"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
          </button>
        </li>

        <li class="drawer-item">
          <button type="button" class="drawer-link" (click)="onNavigate('projects')">
            <span>{{ dict().nav.projects }}</span>
            <svg viewBox="0 0 20 20" fill="currentColor" class="arrow-icon" aria-hidden="true"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
          </button>
        </li>

        <li class="drawer-item">
          <button type="button" class="drawer-link" (click)="onNavigate('clients')">
            <span>{{ dict().nav.clients }}</span>
            <svg viewBox="0 0 20 20" fill="currentColor" class="arrow-icon" aria-hidden="true"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
          </button>
        </li>

        <li class="drawer-item">
          <button type="button" class="drawer-link" (click)="onNavigate('about')">
            <span>{{ dict().nav.about }}</span>
            <svg viewBox="0 0 20 20" fill="currentColor" class="arrow-icon" aria-hidden="true"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
          </button>
        </li>

        <li class="drawer-item">
          <button type="button" class="drawer-link" (click)="onNavigate('contact')">
            <span>{{ dict().nav.contact }}</span>
            <svg viewBox="0 0 20 20" fill="currentColor" class="arrow-icon" aria-hidden="true"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
          </button>
        </li>

      </ul>
    </nav>
  </div>

  <!-- Drawer Footer: Quote & Call Actions -->
  <div class="drawer-footer">
    <button type="button" class="btn btn-primary-orange drawer-cta-btn" (click)="handleQuoteClick()">
      <span>{{ dict().nav.getQuoteBtn }}</span>
    </button>
  </div>
</aside>
