<div class="modal-backdrop" [class.is-open]="isOpen" (click)="closeModal.emit()" aria-hidden="true"></div>

<div class="modal-dialog-wrapper" [class.is-open]="isOpen" [class.dir-rtl]="localeService.isRtl()" role="dialog" aria-modal="true" aria-labelledby="quoteModalTitle">
  <div class="modal-content-card" (click)="$event.stopPropagation()">
    
    <!-- Compact Modal Header -->
    <div class="modal-header">
      <div class="modal-title-wrap">
        <div class="modal-badge-row">
          <span class="pill-badge-mini">✦ {{ dict().hero.badge }}</span>
        </div>
        <h3 id="quoteModalTitle" class="modal-title">{{ dict().quoteModal.title }}</h3>
        <p class="modal-sub">{{ dict().quoteModal.subtitle }}</p>
      </div>
      <button type="button" (click)="closeModal.emit()" class="modal-close-btn" [attr.aria-label]="dict().quoteModal.closeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Alert States -->
    @if (submitSuccess) {
      <div class="alert alert-success" role="alert">
        <svg viewBox="0 0 20 20" fill="currentColor" class="alert-icon"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
        <div><strong>{{ dict().heroForm.successTitle }}</strong> {{ dict().inquiry.successMessage }}</div>
      </div>
    }

    @if (submitError) {
      <div class="alert alert-error" role="alert">
        <svg viewBox="0 0 20 20" fill="currentColor" class="alert-icon"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        <div>{{ submitError }}</div>
      </div>
    }

    <!-- Compact Modal Form Body (2-Column Layout) -->
    <form #quoteForm="ngForm" (ngSubmit)="onSubmit(quoteForm)" class="modal-form-compact" novalidate>
      
      <!-- Row 1: Name & Company Name -->
      <div class="form-row-2col">
        
        <!-- Full Name -->
        <div class="form-group-xs">
          <label for="modalName" class="form-label-xs">{{ dict().inquiry.nameLabel }}</label>
          <div class="input-control-wrapper-xs has-left-icon">
            <input
              type="text"
              id="modalName"
              name="name"
              [(ngModel)]="formData.name"
              #mName="ngModel"
              required
              minlength="2"
              class="form-input-xs"
              [class.is-invalid]="mName.invalid && (mName.dirty || mName.touched)"
              [placeholder]="dict().inquiry.namePlaceholder">
            <span class="input-icon-xs" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
          </div>
        </div>

        <!-- Company Name -->
        <div class="form-group-xs">
          <label for="modalCompany" class="form-label-xs">{{ dict().inquiry.companyLabel }}</label>
          <div class="input-control-wrapper-xs has-left-icon">
            <input
              type="text"
              id="modalCompany"
              name="companyName"
              [(ngModel)]="formData.companyName"
              class="form-input-xs"
              [placeholder]="dict().inquiry.companyPlaceholder">
            <span class="input-icon-xs" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            </span>
          </div>
        </div>

      </div>

      <!-- Row 2: Phone & Email with Dial Code -->
      <div class="form-row-2col">
        
        <!-- Phone / WhatsApp -->
        <div class="form-group-xs">
          <label for="modalPhone" class="form-label-xs">{{ dict().inquiry.phoneLabel }}</label>
          <div class="modal-phone-row">
            <select
              name="modalDialCode"
              [(ngModel)]="selectedDialCode"
              class="modal-dial-select"
              aria-label="Country Dial Code"
              dir="ltr">
              @for (item of dialCodes; track item.countryCode) {
                <option [value]="item.dialCode">
                  {{ item.flag }} {{ item.dialCode }}
                </option>
              }
            </select>
            <div class="input-control-wrapper-xs modal-phone-input">
              <input
                type="tel"
                id="modalPhone"
                name="phone"
                [(ngModel)]="formData.phone"
                #mPhone="ngModel"
                required
                class="form-input-xs ltr-input"
                dir="ltr"
                [class.is-invalid]="mPhone.invalid && (mPhone.dirty || mPhone.touched)"
                [placeholder]="dict().inquiry.phonePlaceholder">
            </div>
          </div>
        </div>

        <!-- Email Address -->
        <div class="form-group-xs">
          <label for="modalEmail" class="form-label-xs">{{ dict().inquiry.emailLabel }}</label>
          <div class="input-control-wrapper-xs has-left-icon">
            <input
              type="email"
              id="modalEmail"
              name="email"
              [(ngModel)]="formData.email"
              #mEmail="ngModel"
              required
              email
              class="form-input-xs ltr-input"
              dir="ltr"
              [class.is-invalid]="mEmail.invalid && (mEmail.dirty || mEmail.touched)"
              [placeholder]="dict().inquiry.emailPlaceholder">
            <span class="input-icon-xs" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
          </div>
        </div>

      </div>

      <!-- Row 3: Solution Type & Math Captcha -->
      <div class="form-row-2col">
        
        <!-- Required Solution Dropdown -->
        <div class="form-group-xs">
          <label for="modalService" class="form-label-xs">{{ dict().inquiry.serviceLabel }}</label>
          <div class="input-control-wrapper-xs has-left-icon">
            <select
              id="modalService"
              name="serviceType"
              [(ngModel)]="formData.serviceType"
              class="form-select-xs">
              @for (srv of services; track srv.id) {
                <option [value]="srv.title">{{ srv.title }}</option>
              }
              <option value="Marketplace Onboarding">Marketplace Onboarding (Amazon/Flipkart)</option>
              <option value="Complete Digital Transformation">Complete Digital Transformation</option>
            </select>
            <span class="input-icon-xs" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            </span>
          </div>
        </div>

        <!-- Math Security Verification -->
        <div class="form-group-xs">
          <div class="captcha-label-row-xs">
            <label for="modalCaptcha" class="form-label-xs">
              {{ dict().inquiry.captchaLabel }}: {{ captchaNum1 }} + {{ captchaNum2 }} = ?
            </label>
            <button type="button" (click)="generateCaptcha()" class="captcha-refresh-btn-xs" title="Refresh math sum" aria-label="Refresh Captcha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            </button>
          </div>
          <div class="input-control-wrapper-xs has-left-icon">
            <input
              type="number"
              id="modalCaptcha"
              name="captcha"
              [(ngModel)]="captchaInput"
              (input)="onCaptchaInput()"
              required
              class="form-input-xs ltr-input"
              dir="ltr"
              [class.is-invalid]="captchaError"
              [placeholder]="dict().inquiry.captchaPlaceholder">
            <span class="input-icon-xs" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            </span>
          </div>
        </div>

      </div>

      <!-- Row 4: Project Requirements Details -->
      <div class="form-group-xs">
        <label for="modalMessage" class="form-label-xs">{{ dict().inquiry.messageLabel }}</label>
        <textarea
          id="modalMessage"
          name="message"
          [(ngModel)]="formData.message"
          rows="2"
          class="form-textarea-xs"
          [placeholder]="dict().inquiry.messagePlaceholder"></textarea>
      </div>

      <!-- Action Buttons Row -->
      <div class="modal-actions-row">
        <button
          type="button"
          (click)="closeModal.emit()"
          class="btn btn-secondary-dark modal-cancel-btn">
          {{ dict().quoteModal.closeBtn }}
        </button>

        <button
          type="submit"
          [disabled]="isSubmitting"
          class="btn btn-primary-orange modal-submit-btn">
          @if (isSubmitting) {
            <span>{{ dict().quoteModal.submittingBtn }}</span>
          } @else {
            <span>{{ dict().quoteModal.submitBtn }} →</span>
          }
        </button>
      </div>

    </form>

  </div>
</div>
